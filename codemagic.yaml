workflows:
  android-build:
    name: Media Downloader Android
    max_build_duration: 60
    instance_type: linux
    environment:
      java: 17
    scripts:
      - name: Compilar APK
        script: |
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - app/build/outputs/apk/debug/*.apk
